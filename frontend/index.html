<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlotSystem 剧情推演</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 提前恢复风格与其明暗偏好，避免首屏闪色。 -->
    <script>
      try {
        const style = localStorage.getItem('plotsystem.uiStyle') || 'spectrum'
        document.documentElement.dataset.uiStyle = style
        const preferred = localStorage.getItem(`plotsystem.${style}.theme`)
        document.documentElement.dataset.theme = preferred || (style === 'glass' ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
